# Nginx SPA fallback for nizamy.com
# Place in /etc/nginx/conf.d/nizamy.conf or server block

server {
    listen 80;
    listen 443 ssl;
    server_name nizamy.com;

    root /var/www/nizamy;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets — long cache (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: all non-file requests → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
